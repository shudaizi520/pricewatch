name: Release image
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Signed stable tag, e.g. v1.0.0'
        required: true
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check approved signed stable tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SIGNING_PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/main'
          [[ "$RELEASE_VERSION" =~ ^v[1-9][0-9]*\.[0-9]+\.[0-9]+$ ]]
          test -n "$SIGNING_PUBLIC_KEY"
          printf '%s' "$SIGNING_PUBLIC_KEY" | gpg --batch --import
          git fetch origin "refs/tags/$RELEASE_VERSION:refs/tags/$RELEASE_VERSION"
          git verify-tag "$RELEASE_VERSION"
          test "$(git rev-list -n 1 "$RELEASE_VERSION")" = "$(git rev-parse HEAD)"
      - name: Validate source and installer version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          version="${RELEASE_VERSION#v}"
          test "$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" = "$version"
          grep -Fx "    image: ghcr.io/${GITHUB_REPOSITORY,,}:$version" compose.ghcr.yml
      - name: Prepare versioned tags
        id: tags
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          version="${RELEASE_VERSION#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "patch=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish linux/amd64 image with SBOM
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: true
          tags: |
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.patch }}
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.minor }}
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.major }}
            ${{ steps.tags.outputs.image }}:latest
  release:
    needs: publish
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          release="repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_VERSION"
          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if ! gh api "$release" --jq '.assets[].name' | grep -Fxq 'compose.ghcr.yml'; then
              gh release upload "$RELEASE_VERSION" compose.ghcr.yml --repo "$GITHUB_REPOSITORY"
            fi
            if test "$(gh api "$release" --jq '.draft')" = 'true'; then
              gh release edit "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
            fi
          else
            gh release create "$RELEASE_VERSION" compose.ghcr.yml \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "PriceWatch ${RELEASE_VERSION#v}" \
              --generate-notes \
              --latest \
              --notes "Docker 镜像：ghcr.io/${GITHUB_REPOSITORY,,}:${RELEASE_VERSION#v}。首次安装可下载下方附带的 compose.ghcr.yml；首次打开会引导创建管理员账号。"
          fi
          if test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>/dev/null || true)" != "$RELEASE_VERSION"; then
            gh release edit "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --latest
          fi
          test "$(gh api "$release" --jq '.draft')" = 'false'
          gh api "$release" --jq '.assets[].name' | grep -Fx 'compose.ghcr.yml'
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')" = "$RELEASE_VERSION"
