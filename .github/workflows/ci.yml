name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c constraints.txt -e '.[test]' pip-audit pip-licenses
      - run: python -m playwright install --with-deps --only-shell chromium
      - run: ruff check src tests alembic
      - run: mypy src/pricewatch
      - run: python -m pytest -q --cov=pricewatch --cov-report=term-missing
      - run: alembic upgrade head
        env:
          PRICEWATCH_DATABASE_URL: sqlite:////tmp/pricewatch-ci.db
      - run: pip-audit
      - run: pip-licenses --format=markdown --with-urls
      - run: git grep -nE 'AKIA[0-9A-Z]{16}|ghp_[a-zA-Z0-9]{36}' -- ':!tests' ':!docs' || test $? -eq 1
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pricewatch:ci .
      - name: Smoke test container health and bundled Chromium
        run: |
          docker run -d --name pricewatch-ci --tmpfs /data:rw,uid=10001,gid=10001 -e PRICEWATCH_APP_SECRET_KEY=ci-only-long-random-placeholder-secret-000001 -p 127.0.0.1:18080:8080 pricewatch:ci
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:18080/healthz; then break; fi
            sleep 2
          done
          if ! curl -fsS http://127.0.0.1:18080/healthz; then
            docker inspect --format '{{.State.Status}} (exit {{.State.ExitCode}}): {{.State.Error}}' pricewatch-ci
            docker exec pricewatch-ci ps -ef
            docker exec pricewatch-ci sh -c 'ls -la /tmp; ls -la /tmp/.X11-unix 2>/dev/null || true'
            docker logs pricewatch-ci
            exit 1
          fi
          docker exec -i pricewatch-ci python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 390, "height": 844})
              page.goto("http://127.0.0.1:8080/initialize")
              page.get_by_label("账号").fill("owner")
              page.get_by_label("密码", exact=True).fill("VeryStrongSecret123!")
              page.get_by_label("确认密码").fill("VeryStrongSecret123!")
              page.get_by_role("button", name="创建并进入").click()
              assert page.get_by_role("heading", name="商品监控").is_visible()
              with page.expect_navigation(wait_until="domcontentloaded"):
                  page.get_by_role("button", name="深色").click()
              page.reload(wait_until="domcontentloaded")
              assert page.locator("html").get_attribute("data-theme") == "dark"
              browser.close()
          PY
      - name: Smoke test fresh install without supplied application secret
        run: |
          docker volume create pricewatch-ci-fresh-data
          docker run -d --name pricewatch-ci-fresh -v pricewatch-ci-fresh-data:/data -p 127.0.0.1:18081:8080 pricewatch:ci
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:18081/healthz; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18081/healthz
          docker exec pricewatch-ci-fresh python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True); page=b.new_page(); page.goto('http://127.0.0.1:8080/initialize'); page.get_by_label('账号').fill('owner'); page.get_by_label('密码',exact=True).fill('VeryStrongSecret123!'); page.get_by_label('确认密码').fill('VeryStrongSecret123!'); page.get_by_role('button',name='创建并进入').click(); assert page.get_by_role('heading',name='商品监控').is_visible(); b.close(); p.stop()"
          before="$(docker exec pricewatch-ci-fresh sha256sum /data/.pricewatch-secret | cut -d' ' -f1)"
          docker exec pricewatch-ci-fresh python -c "from pathlib import Path; p=Path('/data/.pricewatch-secret'); assert p.stat().st_mode & 0o777 == 0o600"
          docker restart pricewatch-ci-fresh
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:18081/healthz; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18081/healthz
          test "$before" = "$(docker exec pricewatch-ci-fresh sha256sum /data/.pricewatch-secret | cut -d' ' -f1)"
          docker exec pricewatch-ci-fresh python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True); page=b.new_page(); page.goto('http://127.0.0.1:8080/login'); page.get_by_label('账号').fill('owner'); page.get_by_label('密码').fill('VeryStrongSecret123!'); page.get_by_role('button',name='登录').click(); assert page.get_by_role('heading',name='商品监控').is_visible(); b.close(); p.stop()"
          secret="$(docker exec pricewatch-ci-fresh cat /data/.pricewatch-secret)"
          if docker logs pricewatch-ci-fresh 2>&1 | grep -Fq "$secret"; then
            echo "Application secret appeared in container logs" >&2
            exit 1
          fi
      - name: Remove smoke container
        if: always()
        run: |
          docker rm -f pricewatch-ci pricewatch-ci-fresh || true
          docker volume rm pricewatch-ci-fresh-data || true
      - name: Report all high and critical container vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pricewatch:ci
          severity: CRITICAL,HIGH
          # Keep unfixed OS findings visible in every CI log.
          exit-code: '0'
      - name: Block high and critical vulnerabilities with available fixes
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pricewatch:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
