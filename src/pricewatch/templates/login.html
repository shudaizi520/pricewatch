<!doctype html>
<html lang="zh-CN">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 PriceWatch</title><link rel="icon" type="image/svg+xml" href="/static/mark.svg"><link rel="stylesheet" href="/static/app.css"></head>
  <body class="auth-body">
    <main class="panel auth-panel">
      <div class="auth-brand"><img class="brand-icon" src="/static/mark.svg" alt=""> PriceWatch</div>
      <h1>欢迎回来</h1><p class="muted">登录你的私有价格观察台</p>
      {% if error %}<p role="alert">{{ error }}</p>{% endif %}
      <form method="post" action="/login">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label>账号 <input name="username" autocomplete="username" required></label>
        <label>密码 <input name="password" type="password" autocomplete="current-password" required></label>
        <button class="button primary" type="submit">登录</button>
      </form>
    </main>
  </body>
</html>
