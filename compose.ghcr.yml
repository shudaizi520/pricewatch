services:
  pricewatch:
    image: ghcr.io/shudaizi520/pricewatch:1.0.0
    restart: unless-stopped
    init: true
    shm_size: 512mb
    ports:
      - "${PRICEWATCH_BIND:-127.0.0.1}:8080:8080"
    environment:
      PRICEWATCH_TIMEZONE: Asia/Shanghai
      PRICEWATCH_EXTERNAL_URL: ${PRICEWATCH_EXTERNAL_URL:-}
      PRICEWATCH_DELL_SOCKS_PROXY_HOST: ${PRICEWATCH_DELL_SOCKS_PROXY_HOST:-}
      PRICEWATCH_DELL_SOCKS_PROXY_PORT: ${PRICEWATCH_DELL_SOCKS_PROXY_PORT:-}
    volumes:
      - pricewatch-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5).close()"]
      interval: 30s
      timeout: 8s
      start_period: 90s
      retries: 3
    security_opt:
      - no-new-privileges:true

volumes:
  pricewatch-data:
