[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pricewatch"
version = "1.0.6"
description = "A small self-hosted Dell-first product price monitor"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
authors = [{ name = "PriceWatch contributors" }]
dependencies = [
  "alembic>=1.14,<2",
  "apscheduler>=3.11,<4",
  "argon2-cffi>=23.1,<26",
  "beautifulsoup4>=4.12,<5",
  "cryptography>=50.0.1,<51",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "jinja2>=3.1,<4",
  "lxml>=5.3,<7",
  "playwright>=1.49,<2",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "freezegun>=1.5,<2",
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "pytest-repeat>=0.9,<1",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
  "pyyaml>=6,<7",
]

[project.scripts]
pricewatch = "pricewatch.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pricewatch"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["pricewatch"]
